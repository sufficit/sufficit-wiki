name: Documentation coverage

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown-coverage:
    name: Markdown hierarchy and links
    # Public repository: GitHub-hosted runners only (see AGENTS.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python3 -m pip install -r scripts/requirements.txt
      - name: Check Markdown coverage
        run: python3 scripts/markdown_coverage.py
      - name: Test the checker
        run: python3 -B -m unittest discover -s tests -v
